name: Deploy backend

# Deploys the sambet-api worker on push to main (Admin@naijaearnings.com.ng
# Cloudflare account). Schema: worker/migrations/*.sql -- all three are already
# applied to the remote `sambet-db` D1 and recorded in d1_migrations, so this
# workflow intentionally deploys code only.
# Requires repo secrets CF_API_TOKEN + CF_ACCOUNT_ID.

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Preflight secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CF_API_TOKEN / CF_ACCOUNT_ID repo secrets (Admin account)."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run typecheck
      - run: npm run test
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply sambet-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      - name: Deploy Worker
        run: npx wrangler deploy
      - name: Verify health
        run: |
          body="$(curl -fsS https://sambet-api.autumn-surf-21ec.workers.dev/api/health)"
          echo "$body"
          echo "$body" | grep -q "sambet-api" || {
            echo "::error::sambet-api health check failed"; exit 1; }